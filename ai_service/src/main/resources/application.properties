# ==================================================
# Quarkus Application Configuration
# ==================================================
quarkus.application.name=ai-service
quarkus.http.port=8083


# ==================================================
# AI Configuration
# ==================================================
# Provider: openai | gemini | openrouter
ai.provider=openrouter

# OpenRouter API Key
openrouter.api-key=${OPENROUTER_API_KEY}

# OpenRouter Base URL
openrouter.base-url=https://openrouter.ai/api/v1

# Chosen by measuring every free tool-calling model against THIS project's system prompt
# (see the benchmark in the notes): 3/3 correct tool calls and the fastest of the set.
# Models that score well on a short prompt can still narrate their reasoning into the
# answer under a prompt this long - nemotron-3.5-lightning does exactly that.
openrouter.model=${OPENROUTER_MODEL:dots-studio/dots-3-note-preview:free}

# Fallback is a different vendor, so a different rate-limit bucket. Measured against the
# real prompt both emit tool_calls reliably; the Google free pool was 429 on every attempt.
openrouter.fallback-model=${OPENROUTER_FALLBACK_MODEL:nvidia/nemotron-nano-9b-v2:free}

# NOTE: the live system prompt is the @SystemMessage annotation on
# org.film.management.ai.AIService - that is what AIChatService reads at runtime.
# A prompt defined here would be loaded but never used, so none is defined.

# Replay cache: repeating a conversation verbatim (rehearsing the demo) costs no
# OpenRouter quota. Set ai.cache-enabled=false to always hit the model.
ai.cache-enabled=${AI_CACHE_ENABLED:true}
ai.cache-ttl-minutes=60

# Model parameters
ai.temperature=0.3
ai.max-tokens=2000
ai.timeout=30


# ==================================================
# Movie Service REST Client Configuration
# ==================================================
movie-service.url=http://${MOVIE_SERVICE_HOST:localhost}:8081

movie-service/mp-rest/url=${movie-service.url}
movie-service/mp-rest/connectTimeout=5000
movie-service/mp-rest/readTimeout=30000

movie-service.timeout=30
movie-service.max-retries=3


# ==================================================
# TMDB API Configuration
# ==================================================
tmdb.api-key=${TMDB_API_KEY}

tmdb.url=https://api.themoviedb.org
tmdb.language=vi-VN

tmdb.timeout=30
tmdb.max-retries=3

tmdb-api/mp-rest/url=${tmdb.url}
tmdb-api/mp-rest/connectTimeout=5000
tmdb-api/mp-rest/readTimeout=30000


# ==================================================
# Logging Configuration
# ==================================================
quarkus.log.level=INFO

quarkus.log.category."org.film.management".level=DEBUG


# ==================================================
# CORS Configuration
# ==================================================
quarkus.rest.cors=true

quarkus.rest.cors.origins=http://localhost:5173

quarkus.rest.cors.methods=GET,POST,PUT,DELETE,OPTIONS

quarkus.rest.cors.headers=Content-Type,Authorization