# ==================================================
# Quarkus Application Configuration
# ==================================================
quarkus.application.name=ai-service
quarkus.http.port=8083


# ==================================================
# AI Configuration
# ==================================================
# Provider: openai | gemini | openrouter
ai.provider=openrouter

# OpenRouter API Key
openrouter.api-key=${OPENROUTER_API_KEY}

# OpenRouter Base URL
openrouter.base-url=https://openrouter.ai/api/v1

# Recommended model for movie chatbot
openrouter.model=openai/gpt-oss-20b:free

# System prompt
ai.system_prompt=B\u1EA1n l\u00E0 tr\u1EE3 l\u00FD \u0111i\u1EC7n \u1EA3nh Aireak Cinema. \
Nhi\u1EC7m v\u1EE5 c\u1EE7a b\u1EA1n l\u00E0 h\u1ED7 tr\u1EE3 kh\u00E1ch h\u00E0ng t\u00ECm ki\u1EBFm th\u00F4ng tin v\u1EC1 phim v\u00E0 l\u1ECBch chi\u1EBFu. \
QUAN TR\u1ECC: Kh\u00F4ng \u0111\u01B0\u1EE3c t\u1EF1 t\u1EA1o th\u00F4ng tin phim, m\u1ECDi d\u1EEF li\u1EC7u ph\u1EA3i l\u1EA5y t\u1EEB c\u00F4ng c\u1EE5 searchMovies. \
\
Khi ng\u01B0\u1EDDi d\u00F9ng y\u00EAu c\u1EA7u DANH S\u00C1CH PHIM, t\u00ECM PHIM, HO\u1EB6C G\u1EE2I \u00DD PHIM: \
- G\u1ECDi tool searchMovies v\u1EDBI keyword ph\u00F9 h\u1EE3p. \
- Ch\u1EC9 tr\u1EA3 v\u1EC1 id v\u00E0 t\u00EAn phim (frontend s\u1EBD hi\u1EC3n th\u1ECB danh s\u00E1ch v\u00E0 n\u00FAt xem chi ti\u1EBFt). \
- Kh\u00F4ng t\u1EF1 \u00FD hi\u1EC3n th\u1ECB th\u00F4ng tin phim d\u01B0\u1EDBi d\u1EA1ng text. \
\
Khi ng\u01B0\u1EDDi d\u00F9ng h\u1ECFI v\u1EC0 L\u1ECA CHI\u1EBEU phim ho\u1EB6C GI\u1EDC CHI\u1EBEU: \
- B\u1EA1n c\u1EA7n tr\u1EA3 l\u1EDDi b\u1EB1ng v\u0103n b\u1EA3n (TEXT) h\u01B0\u1EDBng d\u1EABn ng\u01B0\u1EDDi d\u00F9ng nh\u1EA5p v\u00E0o phim \u0111\u1EC3 xem l\u1ECBch chi\u1EBFu. \
- KH\u00D4NG g\u1ECDi tool searchMovies khi ng\u01B0\u1EDDi d\u00F9ng h\u1ECFI v\u1EC1 l\u1ECBch chi\u1EBFu. \
- Ch\u1EC9 d\u00F9ng searchMovies n\u1EBFU ng\u01B0\u1EDDi d\u00F9ng y\u00EAu c\u1EA7u C\u1EA2 t\u00ECM phim v\u00E0 l\u1ECBch chi\u1EBFu trong c\u00F9ng m\u1ED9t c\u00E2u h\u1ECFi. \
\
Khi ng\u01B0\u1EDDi d\u00F9ng h\u1ECFI v\u1EC0 REVIEW, \u0110\u00C1NH GI\u00C1 phim: \
- G\u1ECDi tool getMovieReviews v\u1EDBi t\u00EAn phim ch\u00EDnh x\u00E1c.

# Model parameters
ai.temperature=0.3
ai.max-tokens=2000
ai.timeout=30


# ==================================================
# Movie Service REST Client Configuration
# ==================================================
movie-service.url=http://movie-service:8081

movie-service/mp-rest/url=${movie-service.url}
movie-service/mp-rest/connectTimeout=5000
movie-service/mp-rest/readTimeout=30000

movie-service.timeout=30
movie-service.max-retries=3


# ==================================================
# TMDB API Configuration
# ==================================================
tmdb.api-key=${TMDB_API_KEY}

tmdb.url=https://api.themoviedb.org
tmdb.language=vi-VN

tmdb.timeout=30
tmdb.max-retries=3

tmdb-api/mp-rest/url=${tmdb.url}
tmdb-api/mp-rest/connectTimeout=5000
tmdb-api/mp-rest/readTimeout=30000


# ==================================================
# Logging Configuration
# ==================================================
quarkus.log.level=INFO

quarkus.log.category."org.film.management".level=DEBUG


# ==================================================
# CORS Configuration
# ==================================================
quarkus.rest.cors=true

quarkus.rest.cors.origins=http://localhost:5173

quarkus.rest.cors.methods=GET,POST,PUT,DELETE,OPTIONS

quarkus.rest.cors.headers=Content-Type,Authorization