quarkus.http.port=8888
quarkus.http.handle-100-continue-automatically=true

quarkus.http.cors=true
quarkus.http.cors.origins=http://localhost:5173
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=Content-Type,Authorization

# support large uploads
quarkus.http.limits.max-body-size=200M

# AI service can take 60-120 seconds for LLM API calls.
# Increase idle timeout to 5 minutes to prevent premature connection closure.
# The default 30s was causing HttpClosedException when AI service was
# waiting for LLM response (no data flowing for >30s).
quarkus.http.idle-timeout=5M

# Service Hosts
identity.service.host=${IDENTITY_SERVICE_HOST:localhost}
movie.service.host=${MOVIE_SERVICE_HOST:localhost}
ticket.service.host=${TICKET_SERVICE_HOST:localhost}
ai.service.host=${AI_SERVICE_HOST:localhost}
