# PayPal sandbox credentials come from the environment only (see .env.example) - no default,
# so a missing value fails at startup instead of silently charging against someone else's app.
paypal:
  client-id: ${PAYPAL_CLIENT_ID}
  client-secret: ${PAYPAL_CLIENT_SECRET}
  environment: ${PAYPAL_ENVIRONMENT:sandbox}
  frontend-url: ${PAYPAL_FRONTEND_URL:http://localhost:5173/payment-result}
  vnd-to-usd-rate: ${PAYPAL_VND_TO_USD_RATE:25000}
